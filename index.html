<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<title>Sổ Tay Chuyến Đi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: fixed colour wash behind everything; a frosted sidebar of trips on the left (chips on phone), the selected trip on the right with a segmented control for Itinerary / Costs. */
:root{
  --accent:#0A84FF;
  --base:#EEF1F6; --ink:#1C1C1E; --ink2:#5E6470; --ink3:#8A8F98;
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78); --glass-edge:rgba(255,255,255,.75);
  --hair:rgba(60,60,67,.14); --field:rgba(118,118,128,.12); --shadow:0 8px 32px rgba(30,40,60,.10),0 1px 2px rgba(30,40,60,.06);
  --good:#248A3D; --good-bg:rgba(52,199,89,.16); --warn:#B25000; --warn-bg:rgba(255,149,0,.18); --danger:#D70015;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --base:#0B0C10; --ink:#F2F2F7; --ink2:#AEB1B8; --ink3:#7C808A;
  --glass:rgba(38,40,48,.52); --glass-strong:rgba(44,46,54,.82); --glass-edge:rgba(255,255,255,.12);
  --hair:rgba(255,255,255,.10); --field:rgba(118,118,128,.24); --shadow:0 8px 32px rgba(0,0,0,.35);
  --good:#30D158; --good-bg:rgba(48,209,88,.16); --warn:#FFB340; --warn-bg:rgba(255,159,10,.18); --danger:#FF453A; color-scheme:dark}}
:root[data-theme="dark"]{
  --base:#0B0C10; --ink:#F2F2F7; --ink2:#AEB1B8; --ink3:#7C808A;
  --glass:rgba(38,40,48,.52); --glass-strong:rgba(44,46,54,.82); --glass-edge:rgba(255,255,255,.12);
  --hair:rgba(255,255,255,.10); --field:rgba(118,118,128,.24); --shadow:0 8px 32px rgba(0,0,0,.35);
  --good:#30D158; --good-bg:rgba(48,209,88,.16); --warn:#FFB340; --warn-bg:rgba(255,159,10,.18); --danger:#FF453A; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--base);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wash{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.wash i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;transition:background .6s}
.wash i:nth-child(1){width:55vw;height:55vw;left:-12vw;top:-18vw;background:var(--accent)}
.wash i:nth-child(2){width:45vw;height:45vw;right:-10vw;top:10vh;background:color-mix(in oklab,var(--accent) 45%,#FF9F0A)}
.wash i:nth-child(3){width:50vw;height:50vw;left:25vw;bottom:-25vw;background:color-mix(in oklab,var(--accent) 40%,#30D158)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wash i{opacity:.32}}
:root[data-theme="dark"] .wash i{opacity:.32}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--glass-edge);box-shadow:var(--shadow);border-radius:var(--r-lg)}
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-block:24px 64px;display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in oklab,var(--accent) 60%,transparent);outline-offset:2px}

/* sidebar */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);padding:16px;display:flex;flex-direction:column;gap:12px}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.side-h h2{font-size:22px;font-weight:700}
.list{display:flex;flex-direction:column;gap:4px}
.trip-btn{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border:0;background:transparent;padding:10px;border-radius:var(--r-md);min-width:0}
.trip-btn:hover{background:var(--field)}
.trip-btn[aria-current="true"]{background:var(--glass-strong);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dot{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.trip-btn b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-btn small{display:block;color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-btn>span{min-width:0}
.status{font-size:12px;color:var(--ink3);padding:0 4px}
.acct{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px;font-size:12px;color:var(--ink2);min-width:0}
.acct:empty{display:none}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{border:0;border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;background:var(--field);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
a.btn{text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.icon{padding:6px;width:32px;height:32px;justify-content:center}
.btn.sm{padding:5px 12px;font-size:13px}

/* main */
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.hero{padding:24px;display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.hero h1{font-size:clamp(28px,4.4vw,40px);font-weight:700;min-width:0}
.dest{color:var(--ink2);font-size:16px;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--field);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.chip b{font-weight:700}

.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--field);border-radius:11px;padding:3px;align-self:flex-start}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 22px;font-weight:600;font-size:14px;white-space:nowrap}
.seg{max-width:100%;overflow-x:auto}
@media (max-width:520px){.seg button{padding:6px 12px;font-size:13px}}
.seg button[aria-selected="true"]{background:var(--glass-strong);box-shadow:0 2px 6px rgba(0,0,0,.1)}

.day{padding:20px 20px 10px}
.day-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--hair)}
.day-n{background:var(--accent);color:#fff;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700}
.day-h h3{font-size:20px;font-weight:700;flex:1;min-width:0}
.day-date{color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
.day-note{color:var(--ink2);margin:10px 0 0;font-size:14px}
.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--hair)}
.stop:last-child{border-bottom:0}
.t{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);padding-top:1px}
.stop h4{margin:0;font-size:16px;font-weight:600}
.stop p{margin:3px 0 7px;color:var(--ink2);font-size:14px;max-width:68ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:color-mix(in oklab,var(--accent) 16%,transparent);color:var(--ink);font-weight:500}
.pill.eat{background:var(--warn-bg)}
.cost-note{color:var(--ink2);font-variant-numeric:tabular-nums}
.maplink{color:var(--accent);font-weight:600;text-decoration:none;display:inline-flex;gap:4px;align-items:center}
.maplink:hover{text-decoration:underline}
.empty-day{color:var(--ink3);padding:14px 0;font-size:14px}
/* checklist */
.todo{padding:18px 20px 10px}
.todo-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.todo-h h3{font-size:20px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:1;min-width:180px;max-width:320px}
.prog .tr{flex:1;height:6px;border-radius:3px;background:var(--field);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--good);border-radius:3px;transition:width .3s}
.tasks{list-style:none;margin:10px 0 0;padding:0}
.task{display:grid;grid-template-columns:28px 1fr 32px;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--hair)}
.task .whos{grid-column:2/3;grid-row:2}
.task:last-child{border-bottom:0}
.task>*{min-width:0}
.ck{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink3);margin:0;cursor:pointer;display:grid;place-items:center;background:transparent}
.ck:checked{background:var(--accent);border-color:var(--accent)}
.ck:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.task.done .tx{color:var(--ink3);text-decoration:line-through}
.task .tx{background:transparent;padding:6px 4px}
.task .tx:focus,.task .who:focus{background:var(--field)}
.task .who{font-size:13px;padding:6px 8px}
.task-ro{font-size:15px}
/* guide */
.guide{display:flex;flex-direction:column;gap:16px}
.gsec{padding:18px 20px 12px}
.gsec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--hair)}
.gsec-h h3{font-size:19px;flex:1;min-width:0}
.gcount{font-size:12px;color:var(--ink3);font-weight:600}
.gitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
.gitem{background:var(--glass-strong);border:1px solid var(--hair);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.gitem b{font-size:15px;font-weight:600}
.gitem p{margin:0;color:var(--ink2);font-size:13.5px}
.psk{display:block;width:100%;height:auto;max-height:120px;margin:-2px 0 6px;border-radius:10px;background:var(--field);color:var(--ink2)}
.psk *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.psk .f{fill:var(--glass-strong)}
.psk .a{stroke:var(--accent)}
.psk .af{fill:var(--accent);stroke:none}
.psk .dk{fill:currentColor;stroke:none}
.psk .thin{stroke-width:1.2;opacity:.6}
.psk .dash{stroke-dasharray:3 3;stroke-width:1.2;opacity:.7}
.psk text{fill:var(--accent);stroke:none;font:600 8px var(--font)}
.gimg{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;margin-bottom:6px;background:var(--field)}
.gimg-wrap{position:relative}
.gimg-wrap .x{position:absolute;top:6px;right:6px;width:26px;height:26px;padding:0;background:rgba(0,0,0,.5);color:#fff}
.mini{font-size:12px;padding:3px 10px}
.gitem .gm{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--ink3);align-items:center;margin-top:2px}
.gedit{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--hair)}
.gedit .full{grid-column:1/-1}
.gedit .tools{flex-direction:row;justify-content:flex-end;grid-column:1/-1}
/* ledger */
.ledger{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.ledger>*{min-width:0}
.lform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;margin-bottom:6px}
.lform>*{min-width:0}
.lform .span2{grid-column:span 2}
.lform .lbl{font-size:11px}
.kind-thu{color:var(--good);font-weight:600}
.kind-chi{color:var(--ink)}
.bal{display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--hair)}
.balrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.balrow small{grid-column:1/-1;color:var(--ink3);font-size:11.5px}
.pos{color:var(--good);font-weight:600}.neg{color:var(--warn);font-weight:600}
.settle{font-size:13px;display:flex;flex-direction:column;gap:4px}
.members{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.members .chip{display:inline-flex;gap:6px;align-items:center}
.members .chip button{border:0;background:transparent;color:var(--ink3);padding:0;cursor:pointer}
@media (max-width:860px){.ledger{grid-template-columns:1fr}}
@media (max-width:520px){.lform{grid-template-columns:1fr 1fr}.lform .span2{grid-column:1/-1}}
/* account */
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:12px}
.av.big{width:84px;height:84px;font-size:30px}
.acct .who{display:flex;align-items:center;gap:8px;min-width:0;border:0;background:transparent;padding:0;cursor:pointer;color:inherit;font:inherit}
.acct .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avrow{display:flex;gap:14px;align-items:center}
/* route */
.route{padding:18px 20px 16px;display:flex;flex-direction:column;gap:12px}
.route-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.route-h h3{font-size:20px;flex:1;min-width:120px}
.route-h select.f{width:auto}
.rbody{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
#routeMap{height:340px;border-radius:var(--r-md);border:1px solid var(--hair);overflow:hidden;position:relative;z-index:0}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.rstop{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--glass-strong);border:1px solid var(--hair);border-radius:12px;padding:8px 10px}
.rstop>*{min-width:0}
.rstop b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rstop small{display:block;font-size:12px;color:var(--ink3)}
.rstop .rt{display:flex;gap:2px}
.rstop .rt .btn{width:28px;height:28px;padding:0;font-size:13px}
.num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.num.start{box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 35%,transparent)}
.num.nogeo{background:var(--ink3)}
.leg{font-size:11.5px;color:var(--accent);font-weight:600}
.rfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rfoot .sub{flex:1;min-width:180px}
.pick{margin-top:6px;align-self:flex-start;border:1px solid var(--hair);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;background:transparent;color:var(--accent);cursor:pointer}
.pick.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.gitem.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pinnum{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;border:2px solid #fff;display:grid;place-items:center;font:700 12px/1 var(--font);box-shadow:0 2px 6px rgba(0,0,0,.3);transform:translate(-13px,-13px)}
.pinnum.start{background:#111;}
.setloc{outline:3px solid var(--warn);outline-offset:-3px}
@media (max-width:860px){.rbody{grid-template-columns:1fr}#routeMap{height:280px}.rlist{max-height:none}}
/* minimal leaflet */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;outline:0;-webkit-tap-highlight-color:transparent;background:var(--field);font:inherit;touch-action:none}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}
.leaflet-pane>svg path{pointer-events:none}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{float:right;margin-right:6px}.leaflet-bottom .leaflet-control{margin-bottom:4px}
.leaflet-control-zoom{border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.leaflet-control-zoom a{display:block;width:32px;height:32px;line-height:32px;text-align:center;text-decoration:none;font-weight:700;font-size:18px;background:var(--glass-strong);color:var(--ink)}
.leaflet-control-attribution{font-size:10px;background:var(--glass-strong);padding:1px 6px;border-radius:6px;color:var(--ink2)}
.leaflet-control-attribution a{color:var(--ink2)}
.leaflet-div-icon{background:transparent;border:0}
.leaflet-tooltip{position:absolute;padding:3px 8px;background:var(--glass-strong);color:var(--ink);border-radius:6px;white-space:nowrap;font-size:12px;box-shadow:var(--shadow);pointer-events:none}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}.leaflet-crosshair{cursor:crosshair}
/* album */
.album{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.album-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.album-h h3{font-size:20px;flex:1;min-width:120px}
.album-h select.f{width:auto}
.upbtn{position:relative;overflow:hidden}
.upbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.linkrow{display:flex;gap:8px}
.linkrow .f{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;border:0;padding:0;border-radius:var(--r-md);overflow:hidden;background:var(--field);aspect-ratio:1/1;max-width:100%;display:block;width:100%}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:12px;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.55));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .badge2{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.5);color:#fff;border-radius:999px;font-size:11px;padding:2px 8px;font-weight:600}
.tile .play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.tile .play i{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
.tile .play i::after{content:"";border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.tile.link{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;color:var(--ink);text-decoration:none;padding:10px;text-align:center;font-size:13px}
.tile.link b{font-size:24px}
.tile .miss{display:grid;place-items:center;height:100%;font-size:12px;color:var(--ink3);padding:8px;text-align:center}
.lb{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img,.lb video{max-width:100%;max-height:68vh;border-radius:12px;background:#000}

<script>
const COLORS=["#0A84FF","#30B0C7","#34C759","#FF9F0A","#FF375F","#5E5CE6","#AC8E68"];
const TYPES=["Tham quan","Ăn uống","Cà phê","Di chuyển","Lưu trú","Mua sắm","Nghỉ","Đi chơi đêm","Khác"];
const EAT=new Set(["Ăn uống","Cà phê"]);
const UNITS={group:"Cả nhóm",person:"× số người",night:"× số đêm",day:"× số ngày",personDay:"× người × ngày"};
const WD=["CN","T2","T3","T4","T5","T6","T7"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vnd=n=>Math.round(n||0).toLocaleString("vi-VN")+" ₫";
const uid=()=>"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let db=null, mode="loading", canWrite=true;
let trips={}, cur=null, editing=false, tab="plan";
const pending={}; let deferRender=false;

/* ---------- storage ---------- */
function setStatus(t){$("#status").textContent=t}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,1800)}
function localLoad(){try{return JSON.parse(localStorage.getItem("trips-v1")||"{}")}catch{return {}}}
function localSave(){try{localStorage.setItem("trips-v1",JSON.stringify(trips))}catch{}}
function save(id,immediate){
  const t=trips[id]; if(!t||!canWrite) return;
  t.updatedAt=Date.now();
  if(mode==="local"){localSave();setStatus("Đã lưu trên trình duyệt này");return}
  clearTimeout(pending[id]); setStatus("Đang lưu…");
  pending[id]=setTimeout(async()=>{
    try{const data=JSON.parse(JSON.stringify(t)), base=synced[id];
      if(base){const ch={};for(const k of Object.keys(data)) if(JSON.stringify(data[k])!==base[k]) ch[k]=data[k];
        const removed=Object.keys(base).some(k=>!(k in data));
        if(removed&&!FB_ON) await db.collection("trips").doc(id).set(data);
        else{for(const k of Object.keys(base)) if(!(k in data)) ch[k]=firebase.firestore.FieldValue.delete();
          if(Object.keys(ch).length) await db.collection("trips").doc(id).update(ch);}}
      else await db.collection("trips").doc(id).set(data);
      markSynced(id,data); setStatus("Đã lưu")}
    catch(e){setStatus(e&&e.code==="quota_exceeded"?"Hết dung lượng lưu, hãy xoá bớt chuyến cũ":"Chưa lưu được, thử lại sau");if(e&&e.code==="invalid_argument"){canWrite=false;render()}}
    finally{delete pending[id]}
  },immediate?0:700);
}
async function removeTrip(id){
  delete trips[id];
  if(mode==="local") localSave();
  else{try{await db.collection("trips").doc(id).delete()}catch{setStatus("Chưa xoá được")}}
  cur=Object.keys(trips).sort(byRecent)[0]||null; route(); render(); toast("Đã xoá chuyến");
}
const byRecent=(a,b)=>(trips[b].updatedAt||0)-(trips[a].updatedAt||0);
const synced={}; let FB_ON=false;
function markSynced(id,data){const m={};for(const k of Object.keys(data)) m[k]=JSON.stringify(data[k]);synced[id]=m}

let unsub=null, fbUser=null;
function subscribe(okText){
  if(unsub){unsub();unsub=null}
  const timer=setTimeout(()=>setStatus("Chưa kết nối được, dữ liệu có thể chưa mới"),10000);
  unsub=db.collection("trips").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);setStatus(okText())}
    const next={};
    snap.docs.forEach(d=>{ const data=d.data(); if(!pending[d.id]) markSynced(d.id,data); next[d.id]= pending[d.id]&&trips[d.id] ? trips[d.id] : structuredClone(data) });
    for(const id in pending) if(trips[id]&&!next[id]) next[id]=trips[id];
    trips=next; if(!cur||!trips[cur]) pick();
    if(document.activeElement&&document.activeElement.closest("main,.modal-open")&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) deferRender=true; else render();
  },e=>{clearTimeout(timer);
    if(e&&(e.code==="permission-denied"||e.code==="permission_denied")){mode="denied";trips={};cur=null;render();setStatus("Tài khoản chưa được cấp quyền")}
    else setStatus("Mất kết nối dữ liệu, tải lại trang để thử lại")});
}
/* ---------- Firebase (bản GitHub): đăng nhập tên + mật khẩu, dữ liệu đồng bộ ---------- */
const FB_DOMAIN=()=>window.FB_EMAIL_DOMAIN||"sotay-chuyen-di.app";
const emailOf=u=>u+"@"+FB_DOMAIN();
let fbAvatars={}, unsubUsers=null;
function initFirebase(){
  firebase.initializeApp(window.FIREBASE_CONFIG); FB_ON=true;
  firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{});
  firebase.auth().onAuthStateChanged(u=>{
    fbUser=u; if(unsub){unsub();unsub=null} if(unsubUsers){unsubUsers();unsubUsers=null}
    trips={};cur=null;
    if(!u){localUser=null;mode="login-local";canWrite=false;setStatus("Chưa đăng nhập");render();$("#lg-user")?.focus();return}
    localUser=(u.email||"").split("@")[0];
    db=firebase.firestore(); mode="db"; canWrite=true; render();
    subscribe(()=>"Đã đồng bộ · mọi người cùng thấy");
    unsubUsers=db.collection("users").onSnapshot(sn=>{fbAvatars={};sn.docs.forEach(d=>{fbAvatars[d.id]=d.data().avatar||""});render()},()=>{});
  });
}
async function fbLogin(u,p){
  u=u.trim().toLowerCase();
  if(!(window.LOCAL_USERS||{})[u]) return "Tài khoản không có trong danh sách thành viên.";
  try{await firebase.auth().signInWithEmailAndPassword(emailOf(u),p);return ""}
  catch(e){
    if(e.code==="auth/too-many-requests") return "Nhập sai nhiều lần, đợi vài phút rồi thử lại.";
    if(e.code==="auth/network-request-failed") return "Không có mạng.";
    // Lần đầu: tài khoản chưa có trên Firebase, mật khẩu khớp mật khẩu ban đầu thì tự tạo
    if(await sha("so-tay-v1:"+u+":"+p)===window.LOCAL_USERS[u]){
      try{await firebase.auth().createUserWithEmailAndPassword(emailOf(u),p);return ""}
      catch(e2){if(e2.code!=="auth/email-already-in-use") return "Chưa tạo được tài khoản: "+e2.code}
    }
    return "Sai tài khoản hoặc mật khẩu.";
  }
}
function signOut(){if(FB_ON){firebase.auth().signOut();return}if(localUser){try{localStorage.removeItem("sotay-session")}catch{};location.reload();return}}
async function migrateLocal(){
  const loc=localLoad(); const ids=Object.keys(loc); if(!ids.length){toast("Máy này không có dữ liệu cũ");return}
  let n=0,ph=0;
  for(const id of ids){const t=loc[id];
    for(const x of (t.photos||[])) if(x.ref&&x.ref.startsWith("i:")){try{const b=await idbOp("readonly",st=>st.get(x.ref.slice(2)));if(b&&b.type.startsWith("image/")){x.ref=(await putMedia(b)).ref;ph++}}catch{}}
    for(const g of (t.guide||[])) for(const x of g.items) if(x.img&&x.img.startsWith("i:")){try{const b=await idbOp("readonly",st=>st.get(x.img.slice(2)));if(b){x.img=(await putMedia(b)).ref;ph++}else delete x.img}catch{}}
    const nid=trips[id]?uid():id; trips[nid]=t; t.updatedAt=Date.now(); save(nid,true); n++}
  try{localStorage.setItem("trips-v1-backup",localStorage.getItem("trips-v1")||"{}");localStorage.removeItem("trips-v1")}catch{}
  toast(`Đã đưa ${n} chuyến và ${ph} ảnh lên dữ liệu chung`); render();
}
/* Simple login gate: only used when config.js provides LOCAL_USERS (GitHub Pages build). Not real security. */
let localUser=null;
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function sessionGet(){try{return JSON.parse(localStorage.getItem("sotay-session")||"null")}catch{return null}}
function userHash(u){try{return localStorage.getItem("sotay-pw-"+u)||window.LOCAL_USERS[u]}catch{return window.LOCAL_USERS[u]}}
function avatarOf(u){if(FB_ON) return fbAvatars[u]||"";try{return localStorage.getItem("sotay-avatar-"+u)||""}catch{return ""}}
function nameOf(u){return (window.LOCAL_NAMES||{})[u]||u}
function avHTML(u,big){const a=avatarOf(u);return a?`<img class="av${big?" big":""}" src="${a}" alt="">`:`<span class="av${big?" big":""}" aria-hidden="true">${esc(nameOf(u).trim().split(/\s+/).pop().charAt(0).toUpperCase())}</span>`}
function openAccount(){
  const u=localUser;
  $("#modal").innerHTML=`<div class="scrim" data-scrim><div class="glass sheet" role="dialog" aria-modal="true">
    <h2>Tài khoản</h2>
    <div class="avrow">${avHTML(u,true)}<div style="display:flex;flex-direction:column;gap:6px">
      <b>${esc(nameOf(u))}</b><span class="sub">Tên đăng nhập: ${esc(u)}</span>
      <div class="actions"><label class="btn sm upbtn">Đổi ảnh đại diện<input type="file" id="avfile" accept="image/*"></label>${avatarOf(u)?`<button class="btn sm" data-act="avDel">Xoá ảnh</button>`:""}</div></div></div>
    ${FB_ON&&Object.keys(localLoad()).length?`<div class="badge ok" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">Máy này còn ${Object.keys(localLoad()).length} chuyến lưu riêng từ trước.<button class="btn sm" data-act="migrate">Đưa lên dữ liệu chung</button></div>`:""}
    <form id="pwForm" style="display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--hair);padding-top:12px">
      <b>Đổi mật khẩu</b>
      <label class="lbl">Mật khẩu hiện tại<input class="f" type="password" id="pw-old" autocomplete="current-password" required></label>
      <label class="lbl">Mật khẩu mới<input class="f" type="password" id="pw-new" autocomplete="new-password" minlength="6" required></label>
      <label class="lbl">Nhập lại mật khẩu mới<input class="f" type="password" id="pw-new2" autocomplete="new-password" required></label>
      <div class="badge over" id="pw-msg" hidden></div>
      <div class="foot"><button type="button" class="btn" data-close>Đóng</button><button class="btn primary">Lưu mật khẩu</button></div>
    </form><div id="pw-done"></div></div></div>`;
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="pwForm") return; e.preventDefault();
  const u=localUser, msg=$("#pw-msg"); msg.hidden=true;
  if(FB_ON){const a=$("#pw-new").value,b=$("#pw-new2").value;

  if(window.LOCAL_USERS&&Object.keys(window.LOCAL_USERS).length){
    const s=sessionGet();

  }
  let user=null;

function defaultTasks(){

function dayDate(t,i){
  if(!t.start) return ""; const d=new Date(t.start+"T00:00:00"); if(isNaN(d)) return "";
  d.setDate(d.getDate()+i); return WD[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
}
function range(t){const a=dayDate(t,0),b=dayDate(t,Math.max(0,t.days.length-1));return a?(t.days.length>1?a+" – "+b:a):"Chưa chọn ngày"}
function mapUrl(q,dest){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([q,dest].filter(Boolean).join(", "))}
function calc(t){
  const p=Math.max(1,+t.people||1), n=+t.nights||0, d=t.days.length||1;
  const mult={group:1,person:p,night:n,day:d,personDay:p*d};
  const rows=(t.items||[]).map(it=>({...it,total:(+it.amount||0)*(+it.qty||0)*(mult[it.unit]??1)}));
  const total=rows.reduce((a,r)=>a+r.total,0);
  return {rows,total,pp:total/p,p};
}

const blobUrls={};
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("sotay-media",1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbOp(mode,fn){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction("files",mode);const q=fn(tx.objectStore("files"));tx.oncomplete=()=>res(q?.result);tx.onerror=()=>rej(tx.error)})}
const sharedMedia=()=>mode==="db";
async function compress(file){
  if(!file.type.startsWith("image/")||file.type==="image/gif"||file.size<600000) return file;
  try{
    const bmp=await createImageBitmap(file); const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.82)); return b&&b.size<file.size?b:file;
  }catch{return file}
}
async function toSmallJpeg(file,maxSide,limit){
  const bmp=await createImageBitmap(file); let side=maxSide, q=.8, out=null;
  for(let i=0;i<6;i++){const k=Math.min(1,side/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); out=c.toDataURL("image/jpeg",q); if(out.length<limit) return out; q-=.1; side=Math.round(side*.85)}
  return out;
}
async function putMedia(file){
  if(FB_ON){
    if(!(file.type||"").startsWith("image/")) throw {code:"video_link"};
    const data=await toSmallJpeg(file,1600,700000); if(data.length>950000) throw {code:"too_big"};
    const id=uid(); await db.collection("media").doc(id).set({data,trip:cur||"",at:Date.now()}); mediaCache["f:"+id]=data; return {ref:"f:"+id,type:"image"};
  }
  const blob=await compress(file), type=file.type.startsWith("video/")?"video":"image";
  if(sharedMedia()){
    if(!assets) throw {code:"not_granted"};
    if(blob.size>20*1024*1024) throw {code:"too_big"};
    const r=await assets.upload(blob,blob.type?undefined:{type:"image/jpeg"}); return {ref:"a:"+r.id,type};
  }
  if(blob.size>200*1024*1024) throw {code:"too_big"};
  const id=uid(); await idbOp("readwrite",s=>s.put(blob,id)); return {ref:"i:"+id,type};
}
async function delMedia(ref){
  if(ref.startsWith("f:")&&FB_ON){try{await db.collection("media").doc(ref.slice(2)).delete()}catch{};delete mediaCache[ref];return}
  try{ if(ref.startsWith("a:")&&assets) await assets.delete(ref.slice(2));
       if(ref.startsWith("i:")){await idbOp("readwrite",s=>s.delete(ref.slice(2)));URL.revokeObjectURL(blobUrls[ref]);delete blobUrls[ref]} }catch{}
}
const mediaCache={};
function mediaSrc(ref){return ref.startsWith("a:")?"/_blob/"+ref.slice(2):ref.startsWith("f:")?(mediaCache[ref]||""):(blobUrls[ref]||"")}
async function hydrateMedia(){
  for(const el of document.querySelectorAll("[data-ref^='f:']")){const ref=el.dataset.ref;
    if(!mediaCache[ref]&&FB_ON){try{const d=await db.collection("media").doc(ref.slice(2)).get();if(d.exists) mediaCache[ref]=d.data().data}catch{}}
    if(mediaCache[ref]){if(el.getAttribute("src")!==mediaCache[ref]) el.src=mediaCache[ref]} else el.closest(".tile,.lbm")?.classList.add("gone")}
  for(const el of document.querySelectorAll("[data-ref^='i:']")){
    const ref=el.dataset.ref;
    if(!blobUrls[ref]){try{const b=await idbOp("readonly",s=>s.get(ref.slice(2)));if(b) blobUrls[ref]=URL.createObjectURL(b)}catch{}}
    if(blobUrls[ref]){if(el.getAttribute("src")!==blobUrls[ref]) el.src=blobUrls[ref]}
    else el.closest(".tile,.lbm")?.classList.add("gone");
  }
  document.querySelectorAll(".gone").forEach(x=>{x.classList.remove("gone");x.innerHTML='<div class="miss">Ảnh chỉ lưu trên máy của người đăng</div>'});
}
async function addFiles(files){
  const t=trips[cur]; if(!t||!files.length) return;
  const day=albumDay==="all"||albumDay==="none"?"":+albumDay; let ok=0, fail=[];
  for(let i=0;i<files.length;i++){
    uploading=`Đang tải ${i+1}/${files.length}…`; const u=$("#upst"); if(u) u.textContent=uploading;
    try{const r=await putMedia(files[i]); t.photos.push({...r,caption:"",day,by:localUser?((window.LOCAL_NAMES||{})[localUser]||localUser):"",at:Date.now()}); ok++}
    catch(e){fail.push(e?.code==="video_link"?"video hãy dán link YouTube/Drive":e?.code==="too_big"?"file quá lớn":e?.code==="unsupported_type"?"định dạng chưa hỗ trợ":e?.code==="quota_exceeded"?"hết dung lượng":"lỗi tải lên")}
  }
  uploading=""; save(cur,true); render();
  toast(ok?`Đã thêm ${ok} ảnh/video`+(fail.length?`, ${fail.length} lỗi (${fail[0]})`:""):`Không tải được: ${fail[0]||""}`);
}
function canUpload(){return canWrite&&(!sharedMedia()||!!assets)}
function tileHTML(x,k){
  const cap=x.caption?`<span class="cap">${esc(x.caption)}</span>`:"";
  const day=x.day!==""&&x.day!=null?`<span class="badge2">Ngày ${+x.day+1}</span>`:"";
  if(x.type==="link"){let host="";try{host=new URL(x.url).hostname.replace(/^www\./,"")}catch{}
    return `<a class="tile link" href="${esc(x.url)}" target="_blank" rel="noopener">${day}<b>↗</b><span>${esc(x.caption||host||"Link")}</span><small style="color:var(--ink3)">${esc(host)}</small></a>`}
  const src=mediaSrc(x.ref);
  const media=x.type==="video"?`<video data-ref="${esc(x.ref)}" ${src?`src="${src}#t=0.1"`:""} muted playsinline preload="metadata"></video><span class="play"><i></i></span>`
    :`<img data-ref="${esc(x.ref)}" ${src?`src="${src}"`:""} alt="${esc(x.caption||"Ảnh chuyến đi")}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=miss>Không tải được ảnh</div>'">`;
  return `<button class="tile" data-act="open" data-k2="${k}" aria-label="Xem ${esc(x.caption||"ảnh")}">${media}${day}${cap}</button>`;
}
function albumHTML(t){
  const list=t.photos.map((x,k)=>[x,k]).filter(([x])=>albumDay==="all"||(albumDay==="none"?(x.day===""||x.day==null):String(x.day)===String(albumDay)));
  const up=canUpload();
  return `<section class="glass album">
    <div class="album-h"><h3>Album</h3>
      <select class="f" id="albumDay" aria-label="Lọc theo ngày"><option value="all">Tất cả (${t.photos.length})</option>${t.days.map((d,i)=>`<option value="${i}" ${String(albumDay)===String(i)?"selected":""}>Ngày ${i+1}${d.title?" · "+esc(d.title):""}</option>`).join("")}<option value="none" ${albumDay==="none"?"selected":""}>Chưa xếp ngày</option></select>
      ${up?`<label class="btn primary upbtn">+ Thêm ảnh / video<input type="file" id="upfile" accept="${FB_ON?"image/*":"image/*,video/*"}" multiple></label>`:""}
    </div>
    ${uploading?`<div class="sub" id="upst">${uploading}</div>`:`<div class="sub" id="upst">${up?(FB_ON?"Ảnh được nén tự động và đồng bộ cho cả nhóm. Video hãy up YouTube/Drive rồi dán link bên dưới.":sharedMedia()?"Ảnh được nén tự động, cả nhóm cùng xem. Video tối đa 20MB, video dài nên dán link YouTube/Drive.":"Ảnh được nén tự động và lưu trên máy này. Video dài nên dán link YouTube/Drive."):(sharedMedia()?"Bạn cần quyền chỉnh sửa trang để đăng ảnh.":"")}</div>`}
    ${canWrite?`<div class="linkrow"><input class="f" id="linkIn" placeholder="Dán link video YouTube, album Google Photos…" inputmode="url"><button class="btn" data-act="addLink">Thêm link</button></div>`:""}
    ${list.length?`<div class="grid">${list.map(([x,k])=>tileHTML(x,k)).join("")}</div>`:`<div class="empty-day">${t.photos.length?"Ngày này chưa có ảnh.":"Chưa có ảnh nào. Bấm “Thêm ảnh / video” để chọn từ thư viện hoặc chụp bằng điện thoại."}</div>`}
  </section>`;
}
function openLB(k){
  const t=trips[cur], x=t.photos[k]; if(!x) return; const src=mediaSrc(x.ref);
  const media=x.type==="video"?`<video class="lbm" data-ref="${esc(x.ref)}" ${src?`src="${src}"`:""} controls playsinline autoplay></video>`:`<img class="lbm" data-ref="${esc(x.ref)}" ${src?`src="${src}"`:""} alt="${esc(x.caption||"Ảnh")}">`;
  $("#lightbox").innerHTML=`<div class="lb" data-lb>
    <button class="btn icon x" data-act="lbClose" aria-label="Đóng">✕</button>${media}
    <div class="glass panel">
      ${canWrite?`<input class="f" data-k="photos.${k}.caption" value="${esc(x.caption)}" placeholder="Chú thích ảnh">
      <div class="row3"><select class="f" data-k="photos.${k}.day" data-day aria-label="Thuộc ngày"><option value="">Chưa xếp ngày</option>${t.days.map((d,i)=>`<option value="${i}" ${String(x.day)===String(i)?"selected":""}>Ngày ${i+1}</option>`).join("")}</select>
        <button class="btn danger" data-act="photoDel" data-k2="${k}">Xoá</button></div>`:`<div>${esc(x.caption||"")}</div>`}
      <div class="sub">${x.by?esc(x.by)+" · ":""}${new Date(x.at||Date.now()).toLocaleDateString("vi-VN")}</div>
    </div></div>`;
  hydrateMedia();
}
function closeLB(){$("#lightbox").innerHTML="";if(tab==="album")render()}
document.addEventListener("change",e=>{
  if(e.target.id==="upfile"){addFiles([...e.target.files]);e.target.value=""}
  if(e.target.id==="albumDay"){albumDay=e.target.value;render()}
});

/* ---------- Lộ trình: chọn điểm, tự sắp xếp, bản đồ ---------- */
let routeDay=0, setLocIdx=-1, _map=null;
const rkey=x=>(x.name||"").trim().toLowerCase()+"|"+(x.addr||"").trim().toLowerCase();
function routeOf(t,d=routeDay){t.routes=t.routes||{};return t.routes[d]=t.routes[d]||[]}
function routeIndex(t,x){return routeOf(t).findIndex(r=>rkey(r)===rkey(x))}
const hav=(a,b)=>{const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const hasGeo=x=>typeof x.lat==="number"&&typeof x.lng==="number";
function sortRoute(t){
  const r=routeOf(t); if(r.length<3&&!r.some(x=>x.start)) {const si=r.findIndex(x=>x.start);if(si>0)r.unshift(...r.splice(si,1));return}
  const geo=r.filter(hasGeo), no=r.filter(x=>!hasGeo(x));
  if(geo.length<2){t.routes[routeDay]=[...geo,...no];return}
  let si=geo.findIndex(x=>x.start); if(si<0) si=0;
  const left=geo.slice(), path=[left.splice(si,1)[0]];
  while(left.length){const last=path[path.length-1];let bi=0,bd=1e9;left.forEach((x,k)=>{const d=hav(last,x);if(d<bd){bd=d;bi=k}});path.push(left.splice(bi,1)[0])}
  // 2-opt, giữ cố định điểm xuất phát, đường mở
  let better=true,guard=0;
  while(better&&guard++<200){better=false;
    for(let i=1;i<path.length-1;i++)for(let k=i+1;k<path.length;k++){
      const a=path[i-1],b=path[i],c=path[k],d=path[k+1];
      const cur=hav(a,b)+(d?hav(c,d):0), nxt=hav(a,c)+(d?hav(b,d):0);
      if(nxt<cur-1e-6){path.splice(i,k-i+1,...path.slice(i,k+1).reverse());better=true}}}
  t.routes[routeDay]=[...path,...no];
}
function routeKm(r){let s=0;for(let i=1;i<r.length;i++)if(hasGeo(r[i])&&hasGeo(r[i-1]))s+=hav(r[i-1],r[i]);return s}
function gmapsDir(t,r){
  const p=x=>hasGeo(x)?x.lat+","+x.lng:[x.name,x.addr,t.destination].filter(Boolean).join(", ");
  if(!r.length) return "";
  if(r.length===1) return mapUrl(r[0].name,t.destination);
  const w=r.slice(1,-1).slice(0,8).map(p).join("|");
  return "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin="+encodeURIComponent(p(r[0]))+"&destination="+encodeURIComponent(p(r[r.length-1]))+(w?"&waypoints="+encodeURIComponent(w):"");
}
async function geocode(x,dest){
  try{const q=[x.name,x.addr,dest].filter(Boolean).join(", ");
    const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=vi&q="+encodeURIComponent(q)).then(r=>r.json());
    if(r[0]) return {lat:+(+r[0].lat).toFixed(5),lng:+(+r[0].lon).toFixed(5)};
    if(x.addr){const r2=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=vi&q="+encodeURIComponent([x.addr,dest].filter(Boolean).join(", "))).then(r=>r.json());
      if(r2[0]) return {lat:+(+r2[0].lat).toFixed(5),lng:+(+r2[0].lon).toFixed(5)}}
  }catch{} return null;
}
async function pickItem(t,i,j){
  const g=t.guide[i], x=g.items[j], r=routeOf(t), k=routeIndex(t,x);
  if(k>=0){r.splice(k,1);sortRoute(t);save(cur);render();return}
  const stop={name:x.name,addr:x.addr||"",note:x.note||"",src:g.title,kind:g.kind||""};
  if(hasGeo(x)){stop.lat=x.lat;stop.lng=x.lng}
  r.push(stop); sortRoute(t); save(cur); render(); toast(`Đã thêm vào lộ trình Ngày ${routeDay+1}`);
  if(!hasGeo(stop)){const c=await geocode(stop,t.destination);
    if(c){Object.assign(stop,c);x.lat=c.lat;x.lng=c.lng;sortRoute(t);save(cur);render()}
    else toast("Chưa tìm được vị trí, bấm “Đặt vị trí” rồi chạm lên bản đồ")}
}

async function addCustomPlace(t){
  const name=($("#cp-name")?.value||"").trim(), addr=($("#cp-addr")?.value||"").trim(); if(!name){toast("Nhập tên địa điểm");return}
  const stop={name,addr,note:"",src:"Địa điểm tự chọn",kind:"custom"};
  // lưu vào danh sách "Địa điểm tự chọn" để lần sau chọn lại nhanh
  let sec=t.guide.find(g=>g.kind==="custom"); if(!sec){sec={title:"Địa điểm tự chọn",kind:"custom",items:[]};t.guide.unshift(sec)}
  let item=sec.items.find(x=>rkey(x)===rkey(stop)); if(!item){item={name,addr,note:"",time:""};sec.items.push(item)}
  if(routeIndex(t,stop)<0){routeOf(t).push(stop)}
  sortRoute(t); save(cur); render(); toast("Đang tìm vị trí…");
  const c=await geocode(stop,t.destination);
  const s2=routeOf(t).find(x=>rkey(x)===rkey(stop));
  if(c&&s2){Object.assign(s2,c);item.lat=c.lat;item.lng=c.lng;sortRoute(t);save(cur);render();toast(`Đã thêm “${name}” vào lộ trình`)}
  else{setLocIdx=routeOf(t).findIndex(x=>rkey(x)===rkey(stop));render();toast("Chưa tìm được vị trí, chạm lên bản đồ để đặt")}
}

function routeHTML(t){
  const r=routeOf(t), km=routeKm(r);
  let prev=null;
  return `<section class="glass route">
    <div class="route-h"><h3>Lộ trình</h3>
      <select class="f" id="routeDay" aria-label="Chọn ngày">${t.days.map((d,i)=>`<option value="${i}" ${i===routeDay?"selected":""}>Ngày ${i+1}${dayDate(t,i)?" · "+dayDate(t,i):""}${(t.routes?.[i]||[]).length?` (${t.routes[i].length})`:""}</option>`).join("")}</select>
      ${r.length>2&&canWrite?`<button class="btn sm" data-act="rSort">Tự xếp theo đường đi</button>`:""}</div>
    ${r.length?`<div class="rbody"><div id="routeMap" class="${setLocIdx>=0?"setloc":""}" aria-label="Bản đồ lộ trình"></div>
      <ol class="rlist">${r.map((x,k)=>{const leg=prev&&hasGeo(prev)&&hasGeo(x)?hav(prev,x):null;prev=x;
        return `<li class="rstop"><span class="num ${k===0?"start":""} ${hasGeo(x)?"":"nogeo"}">${k+1}</span>
          <div><b>${esc(x.name)}</b><small>${leg!=null?`<span class="leg">+${leg<1?Math.round(leg*1000)+" m":leg.toFixed(1)+" km"}</span> · `:k===0?`<span class="leg">Xuất phát</span> · `:""}${esc(x.src||"")}${hasGeo(x)?"":" · chưa có vị trí"}</small></div>
          ${canWrite?`<div class="rt">${k>0?`<button class="btn" data-act="rStart" data-k2="${k}" title="Xuất phát từ đây" aria-label="Xuất phát từ đây">⚑</button>`:""}
            <button class="btn" data-act="rLoc" data-k2="${k}" title="Đặt vị trí trên bản đồ" aria-label="Đặt vị trí">◎</button>
            <button class="btn danger" data-act="rDel" data-k2="${k}" aria-label="Bỏ khỏi lộ trình">✕</button></div>`:""}</li>`}).join("")}</ol></div>
      <div class="rfoot"><span class="sub">${r.length} điểm · khoảng ${(km*1.3).toFixed(1)} km đường đi (ước tính từ khoảng cách thẳng × 1,3)${setLocIdx>=0?` · <b>Chạm lên bản đồ để đặt vị trí “${esc(r[setLocIdx]?.name||"")}”</b>`:""}</span>
        <a class="btn" href="${gmapsDir(t,r)}" target="_blank" rel="noopener">Mở trên Google Maps</a>
        ${canWrite?`<button class="btn primary" data-act="rToPlan">Đưa vào Lịch trình Ngày ${routeDay+1}</button>`:""}</div>`
    :`<p class="sub" style="margin:0">Bấm “+ Chọn vào lộ trình” ở các quán, địa điểm bên dưới, hoặc gõ địa điểm bất kỳ vào ô dưới đây. Trang tự sắp xếp theo đường đi gần nhất, đánh số 1-2-3 và vẽ bản đồ.</p>`}
    ${canWrite?`<form class="custom" id="customForm"><input class="f" id="cp-name" placeholder="Thêm địa điểm tự chọn: homestay, quán bạn biết…" required aria-label="Tên địa điểm"><input class="f" id="cp-addr" placeholder="Địa chỉ (nếu có)" aria-label="Địa chỉ"><button class="btn primary">+ Thêm vào Ngày ${routeDay+1}</button></form>`:""}
  </section>`;
}
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(loadLeaflet.p) return loadLeaflet.p;
  return loadLeaflet.p=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)});
}
function isDark(){const th=document.documentElement.dataset.theme;return th?th==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
async function drawRouteMap(t){
  const el=document.getElementById("routeMap"); if(!el) return;
  try{await loadLeaflet()}catch{el.innerHTML='<div class="miss">Không tải được bản đồ</div>';return}
  if(!document.body.contains(el)) return;
  if(_map){try{_map.remove()}catch{} _map=null}
  const r=routeOf(t), pts=r.filter(hasGeo);
  _map=L.map(el,{zoomControl:true,attributionControl:true,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false});
  L.tileLayer("https://{s}.basemaps.cartocdn.com/"+(isDark()?"dark_all":"light_all")+"/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>'}).addTo(_map);
  const accent=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#0A84FF";
  if(pts.length>1) L.polyline(pts.map(x=>[x.lat,x.lng]),{color:accent,weight:4,opacity:.85,dashArray:"8 8"}).addTo(_map);
  r.forEach((x,k)=>{if(!hasGeo(x))return;
    L.marker([x.lat,x.lng],{icon:L.divIcon({className:"",html:`<div class="pinnum ${k===0?"start":""}">${k+1}</div>`,iconSize:[0,0]})}).addTo(_map).bindTooltip(`${k+1}. ${x.name}`,{direction:"top",offset:[0,-14]});});
  if(pts.length) _map.fitBounds(L.latLngBounds(pts.map(x=>[x.lat,x.lng])).pad(.2),{maxZoom:15});
  else _map.setView([11.9404,108.4583],12);
  _map.on("click",e=>{ if(setLocIdx<0||!canWrite) return; const x=r[setLocIdx]; if(!x) return;
    x.lat=+e.latlng.lat.toFixed(5); x.lng=+e.latlng.lng.toFixed(5);
    t.guide.forEach(g=>g.items.forEach(it=>{if(rkey(it)===rkey(x)){it.lat=x.lat;it.lng=x.lng}}));
    setLocIdx=-1; sortRoute(t); save(cur); render(); toast("Đã đặt vị trí")});
}

const THEMES=["auto","light","dark"];
function themeGet(){try{return localStorage.getItem("sotay-theme")||"auto"}catch{return "auto"}}

  const arms=o.arms!=null?o.arms:o.up?`M${hx} ${y-27*h}L${x-8*h} ${y-40*h}M${hx} ${y-27*h}L${x+8*h} ${y-40*h}`:`M${hx} ${y-27*h}L${x-6*h} ${y-17*h}M${hx} ${y-27*h}L${x+6*h} ${y-17*h}`;

const CATS=["Ăn uống","Lưu trú","Di chuyển","Vé tham quan","Cà phê","Mua sắm","Khác"];
function defaultMembers(t){
  const names=Object.values(window.LOCAL_NAMES||{});
  if(names.length) return names.slice(0,Math.max(names.length,0));
  return Array.from({length:Math.max(1,+t.people||1)},(_,i)=>"Người "+(i+1));
}
function ledgerCalc(t){
  const mem=t.members, n=Math.max(1,mem.length);
  let thu=0, chi=0; const paid={}, put={}; mem.forEach(m=>{paid[m]=0;put[m]=0});
  t.ledger.forEach(r=>{const a=+r.amount||0;
    if(r.kind==="thu"){thu+=a; if(r.by in put) put[r.by]+=a}
    else{chi+=a; if(r.by&&r.by!=="Quỹ"&&r.by in paid) paid[r.by]+=a}});
  const share=chi/n;
  const bal=mem.map(m=>({m,put:put[m],paid:paid[m],net:put[m]+paid[m]-share}));
  // quỹ còn dư (tiền góp chưa chi) chia đều lại theo tỷ lệ là phần của mỗi người đã được tính trong net
  const cred=bal.filter(b=>b.net>0.5).map(b=>({...b})).sort((a,b)=>b.net-a.net);
  const debt=bal.filter(b=>b.net<-0.5).map(b=>({...b,net:-b.net})).sort((a,b)=>b.net-a.net);
  const fund=thu-t.ledger.filter(r=>r.kind!=="thu"&&(r.by==="Quỹ"||!r.by)).reduce((a,r)=>a+(+r.amount||0),0);
  if(fund>0.5) debt.unshift({m:"Quỹ chung",net:fund}); else if(fund<-0.5) cred.unshift({m:"Quỹ chung",net:-fund});
  const moves=[]; let i=0,j=0;
  while(i<debt.length&&j<cred.length){const x=Math.min(debt[i].net,cred[j].net);
    moves.push(`${debt[i].m} → ${cred[j].m}: ${vnd(x)}`); debt[i].net-=x; cred[j].net-=x;
    if(debt[i].net<1)i++; if(cred[j].net<1)j++;}
  return {thu,chi,share,bal,fund,moves};
}

document.addEventListener("submit",e=>{
  if(e.target.id!=="ledgerForm") return; e.preventDefault();
  const t=trips[cur]; const amt=parseInt(($("#lf-amt").value||"").replace(/\D/g,""),10)||0; if(!amt){toast("Nhập số tiền");return}
  const kind=lfKind; let by=lfBy; if(kind==="thu"&&by==="Quỹ") by=t.members[0]||"";
  t.ledger.push({date:$("#lf-date").value,desc:$("#lf-desc").value.trim(),amount:amt,kind,by,cat:kind==="thu"?"":guessCat($("#lf-desc").value)});
  save(cur,true); render(); toast("Đã ghi");
});
function guessCat(s){s=s.toLowerCase();
  if(/cà phê|cafe|cf|trà sữa/.test(s))return "Cà phê";
  if(/phòng|homestay|khách sạn|ks\b/.test(s))return "Lưu trú";
  if(/xe|xăng|grab|taxi|vé xe|máy bay|bus/.test(s))return "Di chuyển";
  if(/vé|tour|cáp treo|tham quan/.test(s))return "Vé tham quan";
  if(/quà|mua|đặc sản|chợ/.test(s))return "Mua sắm";
  if(/ăn|lẩu|bánh|bún|phở|cơm|nướng|nhậu|bia/.test(s))return "Ăn uống";
  return "Khác"}
document.addEventListener("input",e=>{if(e.target.id==="lf-amt"){const r=e.target.value.replace(/\D/g,"");e.target.value=r?(+r).toLocaleString("vi-VN"):""}});
document.addEventListener("change",e=>{if(e.target.matches("[data-relc]")&&tab==="ledger")render()});


/* ---------- Chọn người bằng thanh lưới ---------- */
function memberList(t){const m=(t.members&&t.members.length)?t.members:defaultMembers(t);return m}
function userOfName(n){const L=window.LOCAL_NAMES||{};return Object.keys(L).find(u=>L[u]===n)||""}
function ppAv(n){const u=userOfName(n), a=u?avatarOf(u):"";return a?`<img class="av" src="${a}" alt="">`:`<span class="av" aria-hidden="true">${esc((n||"?").trim().split(/\s+/).pop().charAt(0).toUpperCase())}</span>`}
function peoplePick(t,{k,val,fund,ro,act="pp",multi}){
  const sel=multi?String(val||"").split(",").map(x=>x.trim()).filter(Boolean):[val];
  const btn=(n,isFund)=>`<button type="button" class="pp ${isFund?"fund":""}" data-act="${act}" ${k?`data-k="${k}"`:""} data-v="${esc(n)}" ${multi?"data-multi":""} aria-pressed="${sel.includes(n)}" ${ro?"disabled":""}>${isFund?"":ppAv(n)}${esc(n)}</button>`;
  return `<div class="pp-grid" role="group">${fund?btn("Quỹ",true):""}${memberList(t).map(n=>btn(n)).join("")}</div>`;
}
function todoHTML(t){
  const n=t.tasks.length, d=t.tasks.filter(x=>x.done).length, ro=!canWrite;
  return `<section class="glass todo">
    <div class="todo-h"><h3>Việc cần làm</h3>
      <div class="prog"><span class="tr"><i style="width:${n?d/n*100:0}%"></i></span><span>${d}/${n} xong</span></div></div>
    ${n?`<ul class="tasks">${t.tasks.map((x,k)=>`<li class="task ${x.done?"done":""}">
      <input type="checkbox" class="ck" data-k="tasks.${k}.done" ${x.done?"checked":""} ${ro?"disabled":""} aria-label="Đánh dấu đã xong">
      ${ro?`<span class="tx task-ro">${esc(x.text)}</span><span class="who-ro">${esc(x.who||"")}</span><span></span>`:`
      <input class="f tx" data-k="tasks.${k}.text" value="${esc(x.text)}" aria-label="Tên việc">
      <div class="whos">${peoplePick(t,{k:`tasks.${k}.who`,val:x.who,multi:true})}</div>
      <button class="btn icon danger" data-act="taskDel" data-k2="${k}" aria-label="Xoá việc">✕</button>`}
    </li>`).join("")}</ul>`:`<div class="empty-day">Chưa có việc nào.</div>`}
    ${ro?"":`<div class="add-row"><button class="btn sm" data-act="taskAdd">+ Thêm việc</button>${d?`<button class="btn sm" data-act="taskClear">Xoá việc đã xong</button>`:""}</div>`}
  </section>`;
}
function costHTML(t){
  const c=calc(t), max=Math.max(1,...c.rows.map(r=>r.total)), b=+t.budgetPP||0, ro=!canWrite?"disabled":"";
  return `<div class="costs">
    <section class="glass items">
      <div class="items-h"><h3>Các khoản chi</h3>${canWrite?`<button class="btn sm" data-act="itemAdd">+ Thêm khoản</button>`:""}</div>
      <div class="tbl"><table class="ctable"><thead><tr><th>Khoản</th><th class="num">Đơn giá</th><th class="num">SL</th><th>Tính theo</th><th class="num">Thành tiền</th><th></th></tr></thead><tbody>
      ${c.rows.map((r,k)=>`<tr>
        <td><input class="f" data-k="items.${k}.label" value="${esc(r.label)}" ${ro} aria-label="Tên khoản"></td>
        <td style="width:130px"><input class="f n" inputmode="numeric" data-k="items.${k}.amount" data-money value="${(+r.amount||0).toLocaleString("vi-VN")}" ${ro} aria-label="Đơn giá"></td>
        <td style="width:64px"><input class="f n" type="number" min="0" data-k="items.${k}.qty" data-num value="${r.qty}" ${ro} aria-label="Số lượng"></td>
        <td style="width:150px"><select class="f" data-k="items.${k}.unit" ${ro} aria-label="Tính theo">${Object.entries(UNITS).map(([u,l])=>`<option value="${u}" ${u===r.unit?"selected":""}>${l}</option>`).join("")}</select></td>
        <td class="num" data-total="${k}">${vnd(r.total)}</td>
        <td style="width:40px">${canWrite?`<button class="btn icon danger" data-act="itemDel" data-k2="${k}" aria-label="Xoá khoản">✕</button>`:""}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="sub" style="margin:10px 0 4px">SL là số phòng, số xe… Tính theo nhân thêm với số người, số đêm (${t.nights}) hoặc số ngày (${t.days.length}).</p>
    </section>
    <aside class="glass sum" id="sum">${sumHTML(t)}</aside></div>`;
}
function sumHTML(t){
  const c=calc(t), max=Math.max(1,...c.rows.map(r=>r.total)), b=+t.budgetPP||0;
  return `<div class="lbl2">Mỗi người</div><div class="big">${vnd(c.pp)}</div>
    <div class="sub">Cả nhóm ${c.p} người: ${vnd(c.total)}</div>
    ${b?`<div class="badge ${b>=c.pp?"ok":"over"}">${b>=c.pp?"Trong ngân sách, dư "+vnd(b-c.pp)+" / người":"Vượt ngân sách "+vnd(c.pp-b)+" / người"}</div>`:`<div class="sub">Đặt ngân sách mỗi người trong phần Sửa để so sánh.</div>`}
    <div class="bars">${c.rows.filter(r=>r.total>0).map(r=>`<div class="bar"><span>${esc(r.label)}</span><span class="v">${vnd(r.total/c.p)}</span><span class="tr"><i style="width:${r.total/max*100}%"></i></span></div>`).join("")||`<div class="sub">Nhập đơn giá để xem phân bổ.</div>`}</div>`;
}

/* ---------- events ---------- */
document.addEventListener("input",e=>{
  const el=e.target, k=el.dataset?.k; if(!k||!cur) return; const t=trips[cur];
  let v=el.type==="checkbox"?el.checked:el.value;
  if("day" in el.dataset) v=v===""?"":+v;
  if("money" in el.dataset){const raw=v.replace(/\D/g,"");v=raw?parseInt(raw,10):0;el.value=raw?v.toLocaleString("vi-VN"):""}
  else if("num" in el.dataset){v=Math.max(0,parseInt(v,10)||0)}
  setPath(t,k,v); save(cur);
  if(tab==="cost"){const s=$("#sum");if(s)s.innerHTML=sumHTML(t);calc(t).rows.forEach((r,i)=>{const td=document.querySelector(`[data-total="${i}"]`);if(td)td.textContent=vnd(r.total)})}
  if(k==="name"||k==="start") renderList();
});
document.addEventListener("change",e=>{const k=e.target.dataset?.k;if(k&&(/\.unit$/.test(k)||/\.done$/.test(k)||k==="start"||k==="nights"))render()});
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.trip){cur=b.dataset.trip;editing=false;route();render();window.scrollTo({top:0});return}
  if(b.dataset.tab){tab=b.dataset.tab;render();if(b.closest("#tabbar"))window.scrollTo({top:0});return}
  if(b.dataset.color){trips[cur].color=b.dataset.color;save(cur);render();return}
  const a=b.dataset.act; if(!a) return;
  if(a==="new"){openNew();return}
  if(a==="signout"){signOut();return}
  if(a==="account"){openAccount();return}
  if(a==="avDel"){if(FB_ON){db.collection("users").doc(localUser).set({avatar:""},{merge:true});fbAvatars[localUser]=""}else{try{localStorage.removeItem("sotay-avatar-"+localUser)}catch{}};openAccount();render();return}
  if(a==="migrate"){migrateLocal();return}
  if(a==="copyHash"){navigator.clipboard?.writeText(b.dataset.h).then(()=>toast("Đã sao chép")).catch(()=>toast("Hãy bôi đen dòng trên để sao chép"));return}
  if(a==="sample"){fetch("data/da-lat-3n2d.json").then(r=>r.json()).then(t=>{t.updatedAt=Date.now();trips.tdalat3n2d=t;cur="tdalat3n2d";route();save(cur,true);render()}).catch(()=>toast("Không tải được chuyến mẫu"));return}
  const t=trips[cur]; const i=+b.dataset.i, j=+b.dataset.j;
  const mut=()=>{save(cur);render()};
  switch(a){
    case "edit": editing=!editing; if(!editing) save(cur,true); render(); break;
    case "dup": openNew(true); break;
    case "del": openDel(); break;
    case "dayAdd": t.days.push({title:"",note:"",stops:[]}); mut(); break;
    case "dayDel": t.days.splice(i,1); mut(); break;
    case "dayUp": [t.days[i-1],t.days[i]]=[t.days[i],t.days[i-1]]; mut(); break;
    case "stopAdd": t.days[i].stops.push({time:"",title:"",note:"",type:"Tham quan",cost:"",place:""}); mut(); break;
    case "stopDel": t.days[i].stops.splice(j,1); mut(); break;
    case "up": {const s=t.days[i].stops;[s[j-1],s[j]]=[s[j],s[j-1]];mut();break}
    case "down": {const s=t.days[i].stops;[s[j+1],s[j]]=[s[j],s[j+1]];mut();break}
    case "itemAdd": t.items.push({label:"Khoản mới",amount:0,qty:1,unit:"person"}); mut(); break;
    case "itemDel": t.items.splice(+b.dataset.k2,1); mut(); break;
    case "taskAdd": t.tasks.push({text:"",done:false,who:""}); mut(); setTimeout(()=>{const l=document.querySelectorAll(".task .tx");l[l.length-1]?.focus()},0); break;
    case "taskDel": t.tasks.splice(+b.dataset.k2,1); mut(); break;
    case "taskClear": t.tasks=t.tasks.filter(x=>!x.done); mut(); break;
    case "open": openLB(+b.dataset.k2); break;
    case "pick": pickItem(t,i,j); break;
    case "pp": {const k=b.dataset.k,v=b.dataset.v; if(!k)break;
      if("multi" in b.dataset){const cur0=String(getPath(t,k)||"").split(",").map(x=>x.trim()).filter(Boolean);const nx=cur0.includes(v)?cur0.filter(x=>x!==v):[...cur0,v];setPath(t,k,nx.join(", "))}
      else setPath(t,k,v);
      mut(); break}
    case "lfKind": lfKind=b.dataset.v; lfBy=lfKind==="thu"?(memberList(t)[0]||""):"Quỹ"; keepLedgerDraft(); render(); restoreLedgerDraft(); break;
    case "lfBy": lfBy=b.dataset.v; keepLedgerDraft(); render(); restoreLedgerDraft(); break;
    case "customAdd": addCustomPlace(t); break;
    case "gImgDel": {const x=t.guide[i].items[j]; if(x.img) delMedia(x.img); delete x.img; mut(); break}
    case "rSort": sortRoute(t); mut(); break;
    case "rDel": routeOf(t).splice(+b.dataset.k2,1); setLocIdx=-1; sortRoute(t); mut(); break;
    case "rStart": {const r=routeOf(t); r.forEach(x=>delete x.start); r[+b.dataset.k2].start=true; sortRoute(t); mut(); break}
    case "rLoc": setLocIdx=setLocIdx===+b.dataset.k2?-1:+b.dataset.k2; render(); if(setLocIdx>=0) toast("Chạm lên bản đồ để đặt vị trí"); break;
    case "rToPlan": {const r=routeOf(t), d=t.days[routeDay]; if(!d) break;
      const type=x=>x.kind==="food"?"Ăn uống":x.kind==="cafe"?"Cà phê":"Tham quan";
      r.forEach(x=>d.stops.push({time:"",title:x.name,note:x.note||"",type:type(x),cost:"",place:x.addr?x.name+", "+x.addr:x.name}));
      mut(); toast(`Đã thêm ${r.length} điểm vào Lịch trình Ngày ${routeDay+1}`); break}
    case "gAdd": t.guide[i].items.push({name:"",note:"",addr:"",time:""}); mut(); break;
    case "gDel": t.guide[i].items.splice(j,1); mut(); break;
    case "gUp": {const a=t.guide[i].items;[a[j-1],a[j]]=[a[j],a[j-1]];mut();break}
    case "gsecAdd": t.guide.push({title:"Danh sách mới",items:[]}); mut(); break;
    case "gsecDel": t.guide.splice(i,1); mut(); break;
    case "lDel": t.ledger.splice(+b.dataset.k2,1); mut(); break;
    case "memAdd": {const v=($("#memIn")?.value||"").trim(); if(v&&!t.members.includes(v)){t.members.push(v);mut()} break}
    case "memDel": t.members.splice(i,1); mut(); break;
    case "lbClose": closeLB(); break;
    case "photoDel": {
      if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Bấm lần nữa để xoá";return}
      const [x]=t.photos.splice(+b.dataset.k2,1); if(x?.ref) delMedia(x.ref); save(cur,true); closeLB(); toast("Đã xoá"); break}
    case "addLink": {
      const v=($("#linkIn")?.value||"").trim(); if(!/^https?:\/\//i.test(v)){toast("Hãy dán link bắt đầu bằng https://");return}
      t.photos.push({type:"link",url:v,caption:"",day:albumDay==="all"||albumDay==="none"?"":+albumDay,by:localUser?((window.LOCAL_NAMES||{})[localUser]||localUser):"",at:Date.now()}); mut(); break}
  }
});

/* ---------- sheets ---------- */
function closeModal(){$("#modal").innerHTML=""}
function openNew(dup){
  const src=dup&&trips[cur];
  $("#modal").innerHTML=`<div class="scrim modal-open" data-scrim><form class="glass sheet" id="newForm">
    <h2>${src?"Nhân bản chuyến":"Chuyến đi mới"}</h2>
    <label class="lbl">Tên chuyến<input class="f" id="nf-name" required value="${src?esc(src.name+" (bản sao)"):""}" placeholder="VD: Phú Quốc hè 2027"></label>
    <label class="lbl">Điểm đến<input class="f" id="nf-dest" value="${src?esc(src.destination):""}" placeholder="VD: Phú Quốc, Kiên Giang"></label>
    <div class="grid2">
      <label class="lbl">Ngày đi<input class="f" type="date" id="nf-start"></label>
      <label class="lbl">Số đêm<input class="f" type="number" min="0" id="nf-nights" value="${src?src.nights:2}"></label>
      <label class="lbl">Số người<input class="f" type="number" min="1" id="nf-people" value="${src?src.people:4}"></label>
    </div>
    ${src?`<label class="check"><input type="checkbox" id="nf-keep" checked> Giữ lịch trình và chi phí của chuyến gốc</label>`:""}
    <div class="foot"><button type="button" class="btn" data-close>Huỷ</button><button class="btn primary">Tạo</button></div>
  </form></div>`;
  $("#nf-name").focus();
  $("#newForm").addEventListener("submit",ev=>{
    ev.preventDefault();
    const o={name:$("#nf-name").value.trim()||"Chuyến mới",destination:$("#nf-dest").value.trim(),start:$("#nf-start").value,nights:$("#nf-nights").value,people:$("#nf-people").value};
    let t=blankTrip(o);
    if(src&&$("#nf-keep")?.checked){const c=structuredClone(src);Object.assign(c,{name:t.name,destination:t.destination,start:t.start,nights:t.nights,people:t.people,createdAt:Date.now()});t=c}
    const id=uid(); trips[id]=t; cur=id; editing=!src; tab="plan"; route(); closeModal(); save(id,true); render(); toast("Đã tạo chuyến");
  });
}
function openDel(){
  const t=trips[cur];
  $("#modal").innerHTML=`<div class="scrim" data-scrim><div class="glass sheet" role="dialog" aria-modal="true">
    <h2>Xoá “${esc(t.name)}”?</h2><p class="sub" style="margin:0">Lịch trình và chi phí của chuyến này sẽ bị xoá hẳn, không khôi phục được.</p>
    <div class="foot"><button class="btn" data-close>Huỷ</button><button class="btn primary" style="background:var(--danger)" id="confirmDel">Xoá chuyến</button></div></div></div>`;
  $("#confirmDel").onclick=()=>{closeModal();removeTrip(cur)};
}
$("#modal").addEventListener("click",e=>{if(e.target.matches("[data-scrim]")||e.target.closest("[data-close]"))closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();if($("#lightbox").innerHTML)closeLB()}});
$("#lightbox").addEventListener("click",e=>{if(e.target.matches("[data-lb]"))closeLB()});
$("#newBtn").addEventListener("click",()=>openNew());

init();
</script>
